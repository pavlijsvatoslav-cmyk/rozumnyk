<body><main class="card"><div class="orb">R</div><p class="eyebrow">РОЗУМНИК · ОФЛАЙН</p><h1>Зараз немає з’єднання</h1><p>Збережені теми й надалі доступні. Відкрий меню браузера та повернись до уроку, який зберіг/зберегла для офлайну.</p><div class="hint">Щоб підготувати наступні теми: поки є інтернет, відкрий урок і натисни <strong>«Зберегти для офлайну»</strong>.</div><a class="back" href="/">Назад до сайту</a></main></body>
